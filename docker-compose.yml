services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: prm393-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waste_collection_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-waste_collection_platform}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  identity-service:
    image: ghcr.io/nhatle1682004/prm393-group7-identity:latest
    container_name: prm393-identity-service
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-waste_collection_platform};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-12345};Include Error Detail=true
      ServiceUrls__IdentityService: http://identity-service:8080
      ServiceUrls__WasteReportService: http://waste-report-service:8080
      ServiceUrls__CollectionService: http://collection-service:8080
      ServiceUrls__EngagementService: http://engagement-service:8080
      SmtpSettings__Host: ${SMTP_HOST:-smtp.gmail.com}
      SmtpSettings__Port: ${SMTP_PORT:-587}
      SmtpSettings__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      SmtpSettings__Username: ${SMTP_USERNAME:-}
      SmtpSettings__Password: ${SMTP_PASSWORD:-}
      SmtpSettings__FromName: ${SMTP_FROM_NAME:-Waste Collection Platform}
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ai-prediction-service:
    image: ghcr.io/nhatle1682004/prm393-group7-ai-prediction:latest
    container_name: prm393-ai-prediction-service
    restart: unless-stopped
    environment:
      MODEL_PATH: saved_models/best_model.pth
    ports:
      - "8000:8000"

  waste-report-service:
    image: ghcr.io/nhatle1682004/prm393-group7-waste-report:latest
    container_name: prm393-waste-report-service
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-waste_collection_platform};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-12345};Include Error Detail=true
      ServiceUrls__IdentityService: http://identity-service:8080
      ServiceUrls__WasteReportService: http://waste-report-service:8080
      ServiceUrls__CollectionService: http://collection-service:8080
      ServiceUrls__EngagementService: http://engagement-service:8080
      ServiceUrls__AiPredictionService: http://ai-prediction-service:8000
    ports:
      - "5002:8080"
    volumes:
      - waste-report-uploads:/app/wwwroot/uploads/waste-reports
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
      ai-prediction-service:
        condition: service_started

  collection-service:
    image: ghcr.io/nhatle1682004/prm393-group7-collection:latest
    container_name: prm393-collection-service
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-waste_collection_platform};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-12345};Include Error Detail=true
      ServiceUrls__IdentityService: http://identity-service:8080
      ServiceUrls__WasteReportService: http://waste-report-service:8080
      ServiceUrls__CollectionService: http://collection-service:8080
      ServiceUrls__EngagementService: http://engagement-service:8080
    ports:
      - "5003:8080"
    volumes:
      - collection-uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started
      waste-report-service:
        condition: service_started

  engagement-service:
    image: ghcr.io/nhatle1682004/prm393-group7-engagement:latest
    container_name: prm393-engagement-service
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-waste_collection_platform};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-12345};Include Error Detail=true
      ServiceUrls__IdentityService: http://identity-service:8080
      ServiceUrls__WasteReportService: http://waste-report-service:8080
      ServiceUrls__CollectionService: http://collection-service:8080
      ServiceUrls__EngagementService: http://engagement-service:8080
    ports:
      - "5004:8080"
    volumes:
      - feedback-uploads:/app/wwwroot/uploads/feedbacks
    depends_on:
      postgres:
        condition: service_healthy
      identity-service:
        condition: service_started

  api-gateway:
    image: ghcr.io/nhatle1682004/prm393-group7-api-gateway:latest
    container_name: prm393-api-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ReverseProxy__Clusters__identity__Destinations__identity-1__Address: http://identity-service:8080/
      ReverseProxy__Clusters__waste__Destinations__waste-1__Address: http://waste-report-service:8080/
      ReverseProxy__Clusters__collection__Destinations__collection-1__Address: http://collection-service:8080/
      ReverseProxy__Clusters__engagement__Destinations__engagement-1__Address: http://engagement-service:8080/
    ports:
      - "5000:8080"
    depends_on:
      identity-service:
        condition: service_started
      waste-report-service:
        condition: service_started
      collection-service:
        condition: service_started
      engagement-service:
        condition: service_started

volumes:
  postgres-data:
  waste-report-uploads:
  collection-uploads:
  feedback-uploads:
