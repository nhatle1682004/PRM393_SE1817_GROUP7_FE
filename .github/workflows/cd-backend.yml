name: CD Backend to Local Docker

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-local
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy backend on laptop
    runs-on:
      - self-hosted
      - Windows
      - X64
      - docker-laptop

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'BE'
      )

    env:
      COMPOSE_PROJECT_NAME: prm393-group7

    steps:
      - name: Checkout tested source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'BE' || github.event.workflow_run.head_sha }}
          clean: true

      - name: Show Docker versions
        shell: powershell
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        shell: powershell
        run: |
          docker compose config

      - name: Build Docker services
        shell: powershell
        run: |
          docker compose build

      - name: Deploy Docker services
        shell: powershell
        run: |
          docker compose up -d --remove-orphans

      - name: Show running containers
        shell: powershell
        run: |
          docker compose ps

      - name: Remove unused Docker images
        shell: powershell
        run: |
          docker image prune -f