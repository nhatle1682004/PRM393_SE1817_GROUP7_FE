name: AI Prediction Service CI/CD

on:
  push:
    branches:
      - BE
    paths:
      - 'cnn-waste-classification-opencv-pytorch/**'
      - 'docker-compose.yml'
      - '.github/workflows/ai-prediction-service.yml'

  pull_request:
    branches:
      - BE
    paths:
      - 'cnn-waste-classification-opencv-pytorch/**'
      - 'docker-compose.yml'
      - '.github/workflows/ai-prediction-service.yml'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ai-prediction-service-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/prm393-group7-ai-prediction

jobs:
  ci-cd:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: cnn-waste-classification-opencv-pytorch
          file: cnn-waste-classification-opencv-pytorch/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
