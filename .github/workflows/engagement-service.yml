name: Engagement Service CI/CD

on:
  push:
    branches:
      - BE
    paths:
      - 'src/Services/EngagementService/**'
      - 'src/Shared/**'
      - 'tests/BackendBehavior.Tests/**'
      - 'docker-compose.yml'
      - '.github/workflows/engagement-service.yml'

  pull_request:
    branches:
      - BE
    paths:
      - 'src/Services/EngagementService/**'
      - 'src/Shared/**'
      - 'tests/BackendBehavior.Tests/**'
      - 'docker-compose.yml'
      - '.github/workflows/engagement-service.yml'

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: engagement-service-cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/prm393-group7-engagement
  TEST_PROJECT: tests/BackendBehavior.Tests/BackendBehavior.Tests.csproj

jobs:
  ci-cd:
    name: Test, build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/Services/EngagementService/EngagementService.Api/EngagementService.Api.csproj

      - name: Build
        run: >
          dotnet build
          src/Services/EngagementService/EngagementService.Api/EngagementService.Api.csproj
          --configuration Release
          --no-restore

      - name: Restore test dependencies
        run: dotnet restore "${{ env.TEST_PROJECT }}"

      - name: Build test project
        run: >
          dotnet build "${{ env.TEST_PROJECT }}"
          --configuration Release
          --no-restore

      - name: Run backend behavior tests
        run: >
          dotnet test "${{ env.TEST_PROJECT }}"
          --configuration Release
          --no-build
          --verbosity normal

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Services/EngagementService/EngagementService.Api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
