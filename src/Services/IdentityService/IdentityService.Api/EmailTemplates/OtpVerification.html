<html>

            <td align="center">
                <table width="500" style="background:#fff; padding:24px; border-radius:8px;">

                    </tr>

                    </tr>
                    <tr>
                        <td align="center" style="padding:20px 0;">
                            <div style="font-size:32px; letter-spacing:6px; color:#3498db;">
                                {{OTP}}
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:13px;">
                            Mã có hiệu lực trong <b>5 phút</b>.

                </table>
            </td>
        </tr>

</html>
